# CI: test + build on every push/PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: server_monitoring_test
          POSTGRES_USER: postgres
          # Must match phpunit.xml (.env.testing): those force DB_PASSWORD.
          POSTGRES_PASSWORD: 00000000
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, mbstring, xml, bcmath, zip, sockets, pcntl
          coverage: none

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist

      - name: Setup env
        # No key:generate: tests run under APP_ENV=testing with the key forced
        # by phpunit.xml (.env.testing also carries one).
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env

      - name: Run tests
        run: php artisan test --compact

      - name: Pint check
        run: vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
